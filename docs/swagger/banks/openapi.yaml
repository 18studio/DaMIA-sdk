components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: query
      name: key
      description: GET examples place the key in the query. POST key placement is not documented and POST is not an executable operation in this specification.
  schemas:
    Amount:
      type: object
      properties:
        Сумма: &id004
          oneOf:
          - type: number
            format: double
          - type: string
          description: Declared double; examples quote the value as a string.
    BankInfo:
      type: object
      properties:
        РегНом: &id002
          oneOf:
          - type: integer
          - type: string
          description: Declared integer; examples quote the value as a string.
        Банк:
          type: string
        КраткНаим:
          type: string
        ПолнНаим:
          type: string
        Тип:
          type: string
        ОПФ:
          type: string
        ДатаРег:
          type: string
          description: Described as DD.MM.YYYY.
        ТипЛиц:
          type: string
          description: 'Documented statuses: empty, АНН, ОТЗ, ПРС, САН.'
        Адрес:
          type: string
        Телефоны:
          type: string
        АСВ:
          type: string
          description: 'Described values: Да or Нет.'
        ОГРН:
          type: string
        Лицензия:
          type: array
          items: {}
    Ratings:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              Название: &id001
                oneOf:
                - type: integer
                - type: string
                description: Declared integer; prose or example uses a string.
              Агентство: *id001
              Тип: &id003
                type: string
              Значение:
                oneOf:
                - type: number
                  format: double
                - type: string
                description: Declared double; example includes textual ratings and outlooks.
    BicInfo:
      type: object
      properties:
        БИК: *id002
        Наименование:
          type: string
        ЛатНаим:
          type: string
        РегНом:
          type: string
        Адрес:
          type: string
        ДатаВвода:
          type: string
        ТипУчастника:
          type: string
        SWIFT:
          type: string
        СчетНомер:
          type: string
        СчетЦБНаим:
          type: string
        URRS:
          type: string
          description: Date, if any, according to the documentation.
        LWRS:
          type: string
          description: Date, if any, according to the documentation.
        LMRS:
          type: string
          description: Date, if any, according to the documentation.
        CLRS:
          type: string
          description: Date, if any, according to the documentation.
        СчетСтатус:
          oneOf:
          - type: array
            items: {}
          - type: string
          description: Declared array; example is a string.
    BankReport:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              pokid: *id002
              pokname: *id001
              Название: *id003
              Сумма: *id004
              parent_pokid:
                type: string
                description: Opaque parent identifier; example is symbolic.
    BanksRating:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              РегНом: *id002
              Банк: *id003
              Сумма: *id004
    IndicatorInfo:
      type: object
      properties:
        pokid: *id002
        pokname: *id001
        ПолнНаим:
          type: string
        Размерность:
          type: string
          description: Described units include thousands of rubles, percent and fractions; the table and example
            differ on Cyrillic Т versus Latin T.
        Комментарий:
          type: string
        poktype:
          type: string
        ДатаВвода:
          type: string
          description: Described as DD.MM.YYYY.
        parent_pokid:
          type: string
        Формула:
          type: string
    Statistics:
      type: object
      properties:
        ДатаНач: *id003
        ДатаОконч: *id003
        Методы:
          oneOf:
          - type: array
            items: {}
          - type: object
            additionalProperties:
              type: object
              properties:
                Лимит: &id005
                  type: string
                Истрачено: *id005
          description: Declared array; example is an object keyed by method. Coverage is unknown.
