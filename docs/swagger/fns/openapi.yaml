        page/year описаны в тексте команд, не в таблице.'
      parameters:
      - name: cmd
        in: query
        required: false
        description: add, del, list, chbo или chd.
        schema:
          type: string
          enum:
          - add
          - del
          - list
          - chbo
          - chd
      - name: req
        in: query
        required: false
        description: Для add/del ИНН или ОГРН через запятую.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Для list; 1000 организаций на страницу.
        schema:
          type: integer
      - name: year
        in: query
        required: false
        description: Для chbo год отчетности.
        schema:
          type: integer
      - name: dat
        in: query
        required: false
        description: Для chd дата DD.MM.YYYY или YYYY-MM-DD, позже постановки на мониторинг.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: 'Для chd фильтр типов изменений через запятую: Заявление, СвНаимЮЛ, СвАдресЮЛ, СвРегОрг, СвУчетНО,
