    get:
      operationId: get_search
      summary: Поиск компаний
      description: 'Источник: https://api-fns.ru/api_help. Необязательность параметров, кроме явно отмеченных в
        справке, не установлена.'
      externalDocs:
        url: https://api-fns.ru/api_help
      x-research-notes: Таблица путает типы nextpage/filter и описания полного/краткого названия; filter_any_count
        упоминает req=any вместо q=any.
      parameters:
      - name: q
        in: query
        required: false
        description: Поисковая строка; q=any — поиск по фильтру.
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Страница, обычно 100 результатов; зарегистрированные сегодня — до 5.
        schema:
          type: integer
      - name: filter
        in: query
        required: false
        description: 'Фильтры через +: active, onlyul, onlyip, okved, okvedgroup, region, vyruchka, sotrudnikov,
          datereg, reestrmsp, reestrmsp1/2/3, withphone, withemail. Для зарегистрированных сегодня нужны region
          и onlyul или onlyip.'
        schema:
          type: string
      responses:
        2XX:
          description: Документированный успешный результат JSON; media type — допущение для совместимости, фактический
            заголовок не документирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/searchResponse'
      security:
      - ApiKey: []
    x-post-contract:
      documented: true
      sdk-ready: false
