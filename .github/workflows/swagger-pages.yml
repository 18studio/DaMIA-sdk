name: Publish Swagger UI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: swagger-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Publish pushes from the default branch only; other branches are safe to use for development.
    if: github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Swagger UI site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/swagger/index.html _site/index.html
          for spec in docs/swagger/*/openapi.yaml; do
            service=$(basename "$(dirname "$spec")")
            mkdir -p "_site/$service"
            cp "$spec" "_site/$service/openapi.yaml"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re

          site = Path('_site')
          html = (site / 'index.html').read_text(encoding='utf-8')
          paths = re.findall(r'url:\s*["\']\./([^"\']+/openapi\.yaml)["\']', html)
          if not paths:
              raise SystemExit('No OpenAPI specifications found in Swagger UI configuration')
          missing = [path for path in paths if not (site / path).is_file()]
          if missing:
              raise SystemExit(f'Missing OpenAPI specifications: {missing}')
          print(f'Prepared {len(paths)} specifications')
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
