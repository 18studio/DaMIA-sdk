name: Contract checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run contract checks
        run: PYTHONDONTWRITEBYTECODE=1 uv run --locked pytest -p no:cacheprovider -q tests/test_contract_inventory.py tests/test_service_contract.py tests/test_response_error_contract.py tests/test_e2e_inventory.py
